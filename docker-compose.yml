services:
  db:
    image: supabase/postgres:15.1.1.78
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init.sql:/docker-entrypoint-initdb.d/init.sql

  auth:
    image: supabase/gotrue:v2.132.3
    depends_on:
      - db
    environment:
      GOTRUE_EXTERNAL_DB_URL: postgres://postgres:${POSTGRES_PASSWORD:-password}@db:5432/postgres?sslmode=disable
      GOTRUE_JWT_SECRET: ${JWT_SECRET:-super-secret-jwt-token-with-at-least-32-characters-long}
      GOTRUE_EXTERNAL_EMAIL_ENABLED: "true"
      GOTRUE_SMTP_HOST: mailpit
      GOTRUE_SMTP_PORT: 1025
      GOTRUE_SMTP_ADMIN_EMAIL: admin@example.com
      GOTRUE_SITE_URL: ${SITE_URL:-http://localhost:5173}
      GOTRUE_API_EXTERNAL_URL: ${API_EXTERNAL_URL:-http://localhost:8000}
      GOTRUE_URI_ALLOW_LIST: "*"
      GOTRUE_DB_MAX_POOL_SIZE: 20
      GOTRUE_LOG_LEVEL: info

  kong:
    image: kong:2.8.1
    depends_on:
      - auth
    ports:
      - "8000:8000"
    volumes:
      - ./infra/kong.yml:/usr/local/kong/declarative/kong.yml
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /usr/local/kong/declarative/kong.yml
      KONG_PROXY_LISTEN: 0.0.0.0:8000

  mailpit:
    image: axllent/mailpit
    ports:
      - "8025:8025"

  backend:
    image: golang:1.25-alpine
    working_dir: /app
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD:-password}@db:5432/postgres?sslmode=disable
      JWT_SECRET: ${JWT_SECRET:-super-secret-jwt-token-with-at-least-32-characters-long}
    volumes:
      - .:/app
    command: sh -c "go install github.com/air-verse/air@latest && air"
    depends_on:
      - db

  frontend:
    image: node:22-alpine
    working_dir: /app
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://localhost:8080/api
      VITE_SUPABASE_URL: http://localhost:8000
      VITE_SUPABASE_ANON_KEY: ${ANON_KEY:-fake-anon-key}
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: sh -c "npm install && npm run dev -- --host"

volumes:
  postgres_data:
