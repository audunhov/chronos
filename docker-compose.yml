services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  migrate:
    image: migrate/migrate
    volumes:
      - ./db/migrations:/migrations
    command: -path=/migrations/ -database "postgres://postgres:${POSTGRES_PASSWORD:-password}@db:5432/postgres?sslmode=disable&x-migrations-table=app_migrations" up
    depends_on:
      db:
        condition: service_healthy

  backend:
    image: golang:1.25-alpine
    working_dir: /app
    ports:
      - "8085:8085"
    environment:
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD:-password}@db:5432/postgres?sslmode=disable
      JWT_SECRET: ${JWT_SECRET:-super-secret-jwt-token-with-at-least-32-characters-long}
      PORT: "8085"
    volumes:
      - .:/app
    command: sh -c "go install github.com/air-verse/air@latest && air"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8085/api/health/"]
      interval: 5s
      timeout: 5s
      retries: 20

  frontend:
    image: node:22-alpine
    working_dir: /app
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://backend:8085
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - ./openapi.yaml:/app/openapi.yaml:ro
    command: sh -c "npm install && npm run dev -- --host"
    depends_on:
      backend:
        condition: service_healthy

  mailpit:
    image: axllent/mailpit
    ports:
      - "8025:8025"
      - "1025:1025"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8025/"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
