openapi: 3.0.0
info:
  title: Chronos API
  version: 1.0.0
  description: API for Chronos Medlemsregister

servers:
  - url: http://localhost:8080
    description: Local development server

paths:
  /api/health:
    get:
      operationId: getHealth
      summary: Health check
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                type: string
                example: OK

  /api/auth/signup:
    post:
      operationId: signup
      summary: User signup
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignupRequest'
      responses:
        '201':
          description: User created
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string

  /api/auth/login:
    post:
      operationId: login
      summary: User login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          description: Invalid credentials

  /api/auth/request-magic-link:
    post:
      operationId: requestMagicLink
      summary: Request a magic link for login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
      responses:
        '200':
          description: Request processed

  /api/auth/magic-login:
    get:
      operationId: magicLogin
      summary: Login using a magic link token
      parameters:
        - in: query
          name: token
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          description: Invalid or expired token

  /api/me/profile:
    get:
      operationId: getMyProfile
      summary: Get current user profile
      security:
        - bearerAuth: []
      responses:
        '200':
          description: User profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
    patch:
      operationId: updateMyProfile
      summary: Update personal information
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                email:
                  type: string
      responses:
        '200':
          description: Profile updated

  /api/admin/reactions:
    get:
      operationId: getReactions
      summary: Get event reactions for an organization (includes inherited)
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: org_id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: List of reactions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EventReaction'
    post:
      operationId: createReaction
      summary: Create a new event reaction
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateReactionRequest'
      responses:
        '201':
          description: Reaction created

  /api/admin/organs:
    get:
      operationId: getOrgans
      summary: Get organs for an organization
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: org_id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: List of organs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Organ'
    post:
      operationId: createOrgan
      summary: Create a new organ
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrganRequest'
      responses:
        '201':
          description: Organ created

  /api/admin/organs/members:
    get:
      operationId: getOrganMembers
      summary: Get members of an organ
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: organ_id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: List of members
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OrganMember'
    post:
      operationId: assignOrganMember
      summary: Add a member to an organ
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssignOrganMemberRequest'
      responses:
        '201':
          description: Member assigned
    delete:
      operationId: revokeOrganMember
      summary: Remove a member from an organ
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Member removed

  /api/me/memberships:
    get:
      operationId: getMyMemberships
      summary: Get current user memberships
      security:
        - bearerAuth: []
      responses:
        '200':
          description: List of user memberships
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MyMembership'

  /api/members:
    get:
      operationId: getMembers
      summary: Get members
      security:
        - bearerAuth: []
      parameters:
        - in: header
          name: X-Org-ID
          schema:
            type: string
          description: Optional organization filter
      responses:
        '200':
          description: List of members
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Member'

  /api/organizations:
    get:
      operationId: getOrganizations
      summary: Get unique organization list
      security:
        - bearerAuth: []
      responses:
        '200':
          description: List of organizations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Org'

  /api/organizations/hierarchy:
    get:
      operationId: getOrganizationHierarchy
      summary: Get full organization tree
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Hierarchy list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OrgNode'

  /api/commands/create-organization:
    post:
      operationId: createOrganization
      summary: Create a new organization
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrgRequest'
      responses:
        '201':
          description: Organization created

  /api/commands/delete-organization:
    post:
      operationId: deleteOrganization
      summary: Delete an organization
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Organization deleted

  /api/commands/register-member:
    post:
      operationId: registerMember
      summary: Register a new member
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterMemberRequest'
      responses:
        '201':
          description: Member registered
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string

  /api/commands/update-member:
    post:
      operationId: updateMember
      summary: Update member fields
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateMemberRequest'
      responses:
        '200':
          description: Member updated

  /api/commands/shred-member:
    post:
      operationId: shredMember
      summary: Shred member data (GDPR)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ShredMemberRequest'
      responses:
        '200':
          description: Member shredded

  /api/reports/as-of:
    get:
      operationId: getMembersAsOf
      summary: Get members as of a specific date
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: date
          required: true
          schema:
            type: string
            format: date
        - in: header
          name: X-Org-ID
          schema:
            type: string
      responses:
        '200':
          description: List of members as of date
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Member'

  /api/reports/treasury:
    get:
      operationId: getTreasuryReport
      summary: Get hierarchical financial report
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Treasury report
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TreasuryItem'

  /api/reports/stats:
    get:
      operationId: getStats
      summary: Get membership statistics
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Statistics data
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/StatRow'

  /api/forms:
    get:
      operationId: getForms
      summary: Get available forms
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: org_id
          schema:
            type: string
      responses:
        '200':
          description: List of forms
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Form'

  /api/commands/submit-form:
    post:
      operationId: submitForm
      summary: Submit a form response
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FormResponseRequest'
      responses:
        '201':
          description: Form submitted

  /api/commands/create-form:
    post:
      operationId: createForm
      summary: Create a new form
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateFormRequest'
      responses:
        '201':
          description: Form created

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    SignupRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
        password:
          type: string
        org_id:
          type: string

    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
        password:
          type: string

    AuthResponse:
      type: object
      properties:
        access_token:
          type: string
        user:
          $ref: '#/components/schemas/User'

    OrgNode:
      type: object
      required:
        - id
        - name
        - path
      properties:
        id:
          type: string
        name:
          type: string
        parent_id:
          type: string
          nullable: true
        path:
          type: string
        policy:
          type: object
          additionalProperties: true

    CreateOrgRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string
        parent_id:
          type: string
        policy:
          type: object
          additionalProperties: true

    User:
      type: object
      properties:
        id:
          type: string
        email:
          type: string
        name:
          type: string
        created_at:
          type: string
          format: date-time

    MyMembership:
      type: object
      required:
        - id
        - org_id
        - org_name
        - status
        - role
        - balance
        - updated_at
      properties:
        id:
          type: string
        org_id:
          type: string
        org_name:
          type: string
        status:
          type: string
        role:
          type: string
        balance:
          type: integer
        updated_at:
          type: string
          format: date-time

    Form:
      type: object
      properties:
        id:
          type: string
        org_id:
          type: string
        title:
          type: string
        schema:
          type: object
          additionalProperties: true

    FormResponseRequest:
      type: object
      required:
        - form_id
        - answers
      properties:
        form_id:
          type: string
        answers:
          type: object
          additionalProperties: true

    CreateFormRequest:
      type: object
      required:
        - org_id
        - title
        - schema
      properties:
        org_id:
          type: string
        title:
          type: string
        schema:
          type: object
          additionalProperties: true

    StatRow:
      type: object
      required:
        - label
        - value
      properties:
        label:
          type: string
        value:
          type: integer

    TreasuryItem:
      type: object
      required:
        - id
        - name
        - path
        - local_balance
        - total_branch_balance
      properties:
        id:
          type: string
        name:
          type: string
        path:
          type: string
        local_balance:
          type: integer
        total_branch_balance:
          type: integer

    Org:
      type: object
      required:
        - id
        - name
      properties:
        id:
          type: string
        name:
          type: string

    EventReaction:
      type: object
      properties:
        id:
          type: string
        org_id:
          type: string
        trigger_event:
          type: string
        action_type:
          type: string
        config:
          type: object
          additionalProperties: true
        is_inherited:
          type: boolean

    CreateReactionRequest:
      type: object
      required:
        - org_id
        - trigger_event
        - action_type
        - config
      properties:
        org_id:
          type: string
        trigger_event:
          type: string
        action_type:
          type: string
        config:
          type: object
          additionalProperties: true

    Organ:
      type: object
      properties:
        id:
          type: string
        org_id:
          type: string
        name:
          type: string
        parent_organ_id:
          type: string
        member_count:
          type: integer

    OrganMember:
      type: object
      properties:
        id:
          type: string
        user_id:
          type: string
        name:
          type: string
        email:
          type: string
        role_type:
          type: string
        created_at:
          type: string
          format: date-time

    AssignOrganMemberRequest:
      type: object
      required:
        - organ_id
        - user_id
        - role_type
      properties:
        organ_id:
          type: string
        user_id:
          type: string
        role_type:
          type: string

    CreateOrganRequest:
      type: object
      required:
        - org_id
        - name
      properties:
        org_id:
          type: string
        name:
          type: string
        parent_organ_id:
          type: string

    Member:
      type: object
      required:
        - id
        - org_id
        - name
        - email
        - status
        - role
        - balance
        - updated_at
        - created_at
      properties:
        id:
          type: string
        org_id:
          type: string
        name:
          type: string
        email:
          type: string
        status:
          type: string
        role:
          type: string
        metadata:
          type: object
          additionalProperties: true
        balance:
          type: integer
        fee_formula:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    RegisterMemberRequest:
      type: object
      required:
        - name
        - email
      properties:
        name:
          type: string
        email:
          type: string
        org_id:
          type: string
        metadata:
          type: object
          additionalProperties: true

    UpdateMemberRequest:
      type: object
      required:
        - id
        - updated_fields
      properties:
        id:
          type: string
        updated_fields:
          type: object
          additionalProperties: true

    ShredMemberRequest:
      type: object
      required:
        - id
      properties:
        id:
          type: string
