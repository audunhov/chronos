openapi: 3.0.0
info:
  title: Chronos API
  version: 1.0.0
  description: API for Chronos Medlemsregister

servers:
  - url: http://localhost:8080
    description: Local development server

paths:
  /api/health:
    get:
      summary: Health check
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                type: string
                example: OK

  /api/auth/signup:
    post:
      summary: User signup
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignupRequest'
      responses:
        '201':
          description: User created
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string

  /api/auth/login:
    post:
      summary: User login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          description: Invalid credentials

  /api/members:
    get:
      summary: Get members
      security:
        - bearerAuth: []
      parameters:
        - in: header
          name: X-Org-ID
          schema:
            type: string
          description: Optional organization filter
      responses:
        '200':
          description: List of members
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Member'

  /api/organizations:
    get:
      summary: Get unique organization IDs
      security:
        - bearerAuth: []
      responses:
        '200':
          description: List of organization IDs
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string

  /api/commands/register-member:
    post:
      summary: Register a new member
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterMemberRequest'
      responses:
        '201':
          description: Member registered
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string

  /api/commands/update-member:
    post:
      summary: Update member fields
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateMemberRequest'
      responses:
        '200':
          description: Member updated

  /api/commands/shred-member:
    post:
      summary: Shred member data (GDPR)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ShredMemberRequest'
      responses:
        '200':
          description: Member shredded

  /api/reports/as-of:
    get:
      summary: Get members as of a specific date
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: date
          required: true
          schema:
            type: string
            format: date
        - in: header
          name: X-Org-ID
          schema:
            type: string
      responses:
        '200':
          description: List of members as of date
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Member'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    SignupRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
        password:
          type: string
        org_id:
          type: string

    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
        password:
          type: string

    AuthResponse:
      type: object
      properties:
        access_token:
          type: string
        user:
          $ref: '#/components/schemas/User'

    User:
      type: object
      properties:
        id:
          type: string
        email:
          type: string
        org_id:
          type: string
        role:
          type: string

    Member:
      type: object
      properties:
        id:
          type: string
        org_id:
          type: string
        name:
          type: string
        email:
          type: string
        status:
          type: string
        metadata:
          type: object
          additionalProperties: true
        balance:
          type: integer
        fee_formula:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    RegisterMemberRequest:
      type: object
      required:
        - name
        - email
      properties:
        name:
          type: string
        email:
          type: string
        org_id:
          type: string
        metadata:
          type: object
          additionalProperties: true

    UpdateMemberRequest:
      type: object
      required:
        - id
        - updated_fields
      properties:
        id:
          type: string
        updated_fields:
          type: object
          additionalProperties: true

    ShredMemberRequest:
      type: object
      required:
        - id
      properties:
        id:
          type: string
